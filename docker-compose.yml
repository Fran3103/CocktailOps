services:
  postgres:
    image: postgres:16
    container_name: cocktailOps-postgres
    environment:
      POSTGRES_DB: cocktailOps_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - cocktailops_postgres_data:/var/lib/postgresql/data

volumes:
  cocktailops_postgres_data: